name: Manual Build and Publish (GHCR)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag adicional da imagem (ex.: v1.2.0)"
        required: false
        type: string
      push_latest:
        description: "Também publicar a tag latest"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      APP_DIRECTORY: ${{ vars.APP_DIRECTORY || 'Lafis' }}
      DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'Lafis/Dockerfile' }}
      GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required variables and secrets
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test -n "$GHCR_IMAGE_NAME" || { echo "Missing repository variable: GHCR_IMAGE_NAME"; exit 1; }
          test -n "$GHCR_USERNAME" || { echo "Missing repository secret: GHCR_USERNAME"; exit 1; }
          test -n "$GHCR_TOKEN" || { echo "Missing repository secret: GHCR_TOKEN"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIRECTORY }}
        run: npm ci

      - name: Build Angular app
        working-directory: ${{ env.APP_DIRECTORY }}
        run: npm run build

      - name: Compute image name and tags
        id: meta
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_LC="$(echo "${GHCR_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/${OWNER_LC}/${IMAGE_LC}"
          SHORT_SHA="${GITHUB_SHA::7}"

          TAGS="${IMAGE_REF}:sha-${SHORT_SHA}"

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_REF}:${{ inputs.image_tag }}"
          fi

          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_REF}:latest"
          fi

          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIRECTORY }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
